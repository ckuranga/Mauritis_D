name: CI

on:
  push:
  pull_request:

jobs:
  compose-healthcheck:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SESSION_SECRET: ci-session-secret-change-me-32-characters-long
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: CiPassword12345
      ADMIN_NAME: CI Administrator

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start Compose services
        run: docker compose up -d --build --pull always

      - name: Wait for web healthcheck
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' site-web-1 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" || "$status" == "exited" || "$status" == "dead" ]]; then
              docker compose ps -a
              docker compose logs --no-color web db
              exit 1
            fi
            sleep 5
          done
          docker compose ps -a
          docker compose logs --no-color web db
          exit 1

      - name: Verify health endpoint
        run: curl --fail --show-error --retry 5 --retry-delay 2 http://localhost:3001/api/health

      - name: Show service status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color web db

      - name: Stop Compose services
        if: always()
        run: docker compose down -v
