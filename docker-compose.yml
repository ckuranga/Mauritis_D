services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: school
    volumes:
      - school-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      DATABASE_URL: postgresql://school:${POSTGRES_PASSWORD_URLENCODED:?Set POSTGRES_PASSWORD_URLENCODED in .env}@db:5432/school
      SITE_URL: http://localhost:3001
      COOKIE_SECURE: "false"
      SESSION_SECRET: ${SESSION_SECRET:?Create a .env file first (see .env.docker.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Create a .env file first (see .env.docker.example)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create a .env file first (see .env.docker.example)}
      ADMIN_NAME: ${ADMIN_NAME:-Site Administrator}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-40}

volumes:
  school-db:
